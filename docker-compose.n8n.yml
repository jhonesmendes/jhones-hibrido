# ============================================================
# Add-on n8n de uma instância Vocero (spec 009, US7 — bot MDF-e).
#
# Sobe o n8n do PRÓPRIO operador (Constituição II, categoria 4) na mesma rede
# da instância, para os workflows falarem com o Postgres e com o app pelo nome
# do serviço. Gerado e usado por scripts/install/addon-mdfe.sh.
# ============================================================
services:
  n8n:
    image: n8nio/n8n:${N8N_VERSION:-2.46.6}
    restart: unless-stopped
    ports:
      - "${N8N_PORT:-5678}:5678"
    environment:
      N8N_ENCRYPTION_KEY: "${N8N_ENCRYPTION_KEY:?Defina N8N_ENCRYPTION_KEY (openssl rand -hex 32)}"
      WEBHOOK_URL: "${N8N_PUBLIC_URL:?Defina N8N_PUBLIC_URL (endereço público do n8n)}/"
      N8N_EDITOR_BASE_URL: "${N8N_PUBLIC_URL}/"
      N8N_SECURE_COOKIE: "${N8N_SECURE_COOKIE:-true}"
      # Os nós de código leem MDFE_API_USER/MDFE_API_PASS do ambiente.
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      GENERIC_TIMEZONE: "${N8N_TIMEZONE:-America/Cuiaba}"
      TZ: "${N8N_TIMEZONE:-America/Cuiaba}"
      MDFE_API_USER: "${MDFE_API_USER:-}"
      MDFE_API_PASS: "${MDFE_API_PASS:-}"
    volumes:
      - n8n_data:/home/node/.n8n
    networks:
      - vocero-net

volumes:
  n8n_data:
    name: "${N8N_VOLUME:?Defina N8N_VOLUME (único por instância)}"

networks:
  vocero-net:
    external: true
    name: "${NETWORK_NAME:?Defina NETWORK_NAME}"
