services:
  app:
    image: ghcr.io/jhonesmendes/jhones-hibrido:latest

    restart: unless-stopped

    ports:
      - "${APP_PORT:-3000}:3000"

    environment:
      APP_BASE_URL: ${APP_BASE_URL}

      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}

      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}

      META_WEBHOOK_VERIFY_TOKEN: ${META_WEBHOOK_VERIFY_TOKEN}
      META_APP_SECRET: ${META_APP_SECRET:-}
      META_GRAPH_API_VERSION: ${META_GRAPH_API_VERSION:-v25.0}

      OPENROUTER_API_TOKEN: ${OPENROUTER_API_TOKEN:-}
      OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-https://openrouter.ai/api}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-}
      OPENROUTER_JUDGE_MODEL: ${OPENROUTER_JUDGE_MODEL:-}

      ALLOW_SIGNUP: ${ALLOW_SIGNUP:-}
      AGENT_COALESCE_MS: ${AGENT_COALESCE_MS:-6000}

      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}

      LICENSE_CONTROL_SECRET: ${LICENSE_CONTROL_SECRET:-}
      OPERATOR_WHATSAPP: ${OPERATOR_WHATSAPP:-}
      OPERATOR_EMAIL: ${OPERATOR_EMAIL:-}
      INTERNAL_API_KEY: vocero_internal_2024

    volumes:
      # Backup do banco (pg_dump) — disco local da própria instância,
      # persiste entre redeploys (Constituição II: nada de S3/R2).
      - vocero_backups:/app/backups

    depends_on:
      postgres:
        condition: service_healthy

    networks:
      - vocero-net

  postgres:
    image: postgres:16-alpine

    restart: unless-stopped

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    volumes:
      - vocero_pg:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

    networks:
      - vocero-net

volumes:
  vocero_pg:
    name: ${POSTGRES_VOLUME}
  vocero_backups:
    name: ${BACKUPS_VOLUME:-vocero_backups}

networks:
  vocero-net:
    name: ${NETWORK_NAME}
    driver: bridge