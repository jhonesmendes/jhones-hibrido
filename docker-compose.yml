services:
  app:
    image: ghcr.io/jhonesmendes/jhones-hibrido:latest
    ports:
      - "${APP_PORT:-3000}:3000"
    restart: unless-stopped

    environment:
      APP_BASE_URL: ${APP_BASE_URL}

      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-vocero}

      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}

      META_WEBHOOK_VERIFY_TOKEN: ${META_WEBHOOK_VERIFY_TOKEN}
      META_APP_SECRET: ${META_APP_SECRET:-}
      META_GRAPH_API_VERSION: ${META_GRAPH_API_VERSION:-v25.0}

      OPENROUTER_API_TOKEN: ${OPENROUTER_API_TOKEN:-}
      OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-https://openrouter.ai/api}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-}
      OPENROUTER_JUDGE_MODEL: ${OPENROUTER_JUDGE_MODEL:-}

      ALLOW_SIGNUP: ${ALLOW_SIGNUP:-}
      AGENT_COALESCE_MS: ${AGENT_COALESCE_MS:-6000}

    depends_on:
      postgres:
        condition: service_healthy

    networks:
      - vocero-net

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-vocero}

    volumes:
      - ${POSTGRES_VOLUME:-vocero_pg}:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ${POSTGRES_DB:-vocero}"]
      interval: 10s
      timeout: 5s
      retries: 10

    networks:
      - vocero-net

volumes:
  vocero_pg:
   name: ${POSTGRES_VOLUME:-vocero_pg}

networks:
  vocero-net:
    driver: bridge
